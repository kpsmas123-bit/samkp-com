/* The map is the whole page, so the header sits in flow above it rather than
   floating over it. It keeps the site's orange field, like every other page;
   only the height is trimmed, since the map takes whatever is left. */
html,body{height:100%;overflow:hidden}
body{background:var(--field);font-family:var(--ui-font),system-ui,sans-serif;display:flex;flex-direction:column}
/* Only what this page needs: the header sits in flow above the map rather than
   floating over it. Its size, measure and brand come from site.css unchanged, so
   the bar is identical to every other page. */
nav{background:var(--field);position:relative;z-index:10}
.map-frame{flex:1;width:100%;border:none;display:block;min-height:0}

/* On a phone the branded bar is 184px — 23% of the viewport — sitting on top of
   a map that wants to be full screen. This is the one page where the header is
   not the point, so the wordmark steps aside below 640px and the links run in a
   single row, returning ~128px to the map. Every other page keeps its wordmark. */
@media(max-width:640px){
  nav .brand{display:none}
  nav:has(.brand){flex-direction:row;padding:6px 12px;gap:6px}
}

  <a style="color:#F2B417" href="https://kpsmas123-bit.github.io/berkeley-precinct-map/">Open it directly</a>.</p></noscript>
<script>
/* Deep links.
   The map lives on GitHub Pages in its own repo and is embedded here, so without
   this bridge every samkp.com visitor landed on the default view and a link to a
   particular contest or candidate could only be shared as a github.io URL.

   URL scheme on this page:
     /precinct-map.html#<berkeley map hash>
     /precinct-map.html#county/<county map hash>
   e.g. #county/2024-11-general/u-s-representative-12th-congressional-district/deviation/c-lateefah-simon

   The map posts its hash here whenever it changes, so the address bar always
   describes what is on screen, and it asks for this page's URL when someone uses
   its "copy link" button. Only messages from the map's own origin are honoured. */
(function () {
  var BASE = "https://kpsmas123-bit.github.io/berkeley-precinct-map/";
  var ORIGIN = "https://kpsmas123-bit.github.io";
  var frame = document.getElementById("mapFrame");

  function srcFromHash() {
    var h = (location.hash || "").replace(/^#/, "");
    var county = /^county(\/|$)/.test(h);
    if (county) h = h.replace(/^county\/?/, "");
    return BASE + (county ? "county.html" : "index.html") + (h ? "#" + h : "");
  }
  frame.src = srcFromHash();

  window.addEventListener("message", function (ev) {
    if (ev.origin !== ORIGIN) return;
    var d = ev.data || {};
    if (d.type === "bpm:hash") {
      var inner = String(d.hash || "").replace(/^#/, "");
      var h = d.page === "county" ? "#county" + (inner ? "/" + inner : "") : (inner ? "#" + inner : "");
      if (location.hash !== h) {
        history.replaceState(null, "", location.pathname + location.search + h);
      }
    } else if (d.type === "bpm:share-url-request" && ev.source) {
      ev.source.postMessage({ type: "bpm:share-url", url: location.href }, ORIGIN);
    }
  });

  // back/forward, or someone pasting a different link into the address bar
  window.addEventListener("hashchange", function () {
    var want = srcFromHash();
    if (frame.src !== want) frame.src = want;
  });
})();
</script>
