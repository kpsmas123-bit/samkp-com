name: D1 count updates

# GitHub only runs `schedule` on a best-effort queue: slots on :00 and :30 are the
# most contended and get delayed by hours or dropped outright. The old schedule
# (:00/:30, 5-hour window, 3 UTC weekdays) lost most of its slots - of 11 slots on
# each of Nov 06/07 UTC only 2 and 3 ran, landing 7-8 hours late, and every slot for
# Nov 10 UTC (Mon Nov 09 PT) was dropped, so the 4:59 PM report was never polled.
#
# Fix: poll every day, off the :00/:30 peak, every 15 min across the afternoon and
# evening, with an hourly catch-up overnight. Dropping a slot no longer loses a
# report - the next slot picks it up. Re-polling is free: the script dedupes on the
# county's "Last Updated" string and exits 0 without writing when nothing changed.
#
# Pacific is PST (UTC-8) for the whole Nov 3 - Dec 3 2026 window (DST ended Nov 1),
# so 00:00 UTC = 4:00 PM PT the previous day.
on:
  schedule:
    - cron: '7,22,37,52 22-23,0-7 * * *'  # 2:07 PM - 11:52 PM PT, every 15 min
    - cron: '12 8-21 * * *'               # 12:12 AM - 1:12 PM PT, hourly catch-up
  workflow_dispatch:             # manual trigger (gated by repo write access)

permissions:
  contents: write

concurrency:
  group: d1-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stop after certification (Dec 3, 2026)
        run: |
          TODAY=$(TZ=America/Los_Angeles date +%F)
          if [[ "$TODAY" > "2026-12-03" ]]; then
            echo "::notice::$TODAY is past certification (2026-12-03) - skipping. Safe to disable this workflow."
            exit 0
          fi
          echo "PT date $TODAY - in window"
          echo "IN_WINDOW=1" >> "$GITHUB_ENV"

      - name: Poll county and append any new report
        if: env.IN_WINDOW == '1'
        run: bash scripts/build-updates.sh

      - name: Commit if updates.json changed
        if: env.IN_WINDOW == '1'
        run: |
          if git diff --quiet -- d1/updates.json; then
            echo "no change to commit"
            exit 0
          fi
          SEQ=$(jq -r 'max_by(.seq).seq' d1/updates.json)
          ROV=$(jq -r 'max_by(.seq).rov_updated' d1/updates.json)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add d1/updates.json
          git commit -m "D1: add update seq ${SEQ} (${ROV})"
          git push
