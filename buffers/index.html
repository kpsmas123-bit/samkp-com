<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berkeley 600-ft Childcare Buffers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600&display=swap" rel="stylesheet">
<style>
/*
VOICE: plain working map, newspaper graphics-desk clarity.
IDEA: a planning-department overlay sheet: street base, red buffer stamps.
PICTURE: the map itself, full width, circles overlapping.
COLOUR and TYPE: white ground, grey streets, one red for buffers; Outfit + Inter.
LAYOUT: finding and three figures on top, map, then what's missing and method.
*/
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#10161d);--ink:light-dark(#10223a,#e6ebf1);--mute:light-dark(#5b6878,#9aa6b4);
--map:light-dark(#f4f5f2,#18212b);--line:light-dark(#d9dde2,#2a3542);
--r3:light-dark(#c9ced4,#3a4654);--r2:light-dark(#9aa3ad,#5d6b7b);--r1:light-dark(#5f6b78,#8d9aa9);--r0:light-dark(#8a7a5a,#a38f63);
--red:#d62828;--redfill:#e63946;--bnd:light-dark(#10223a,#c9d3de)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(22px,3.5vw,48px) max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1{font:600 clamp(28px,4vw,44px)/1.08 Outfit,Inter,sans-serif;margin:0 0 10px;text-wrap:balance}
.lede{color:var(--mute);max-width:70ch;margin:0}
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:22px}
.fg{border-top:2px solid var(--ink);padding-top:8px}
.fg b{display:block;font:600 clamp(26px,3.4vw,38px)/1.1 Outfit,Inter,sans-serif;white-space:nowrap}
.fg b.red{color:var(--red)}
.fg span{font-size:14px;color:var(--mute)}
#map{height:min(78vh,760px);min-height:420px;background:var(--map);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--mute);margin-top:12px}
.legend i{display:inline-block;vertical-align:-3px;margin-right:7px}
.lc{width:16px;height:16px;border-radius:50%;background:rgba(230,57,70,.22);border:1.5px solid var(--red)}
.ld{width:9px;height:9px;border-radius:50%;background:var(--red);vertical-align:0!important}
.lr{width:22px;height:3px;background:var(--r1);vertical-align:4px!important}
.lb{width:22px;height:0;border-top:2px dashed var(--bnd);vertical-align:4px!important}
h2{font:600 22px/1.2 Outfit,Inter,sans-serif;margin:0 0 10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,56px)}
p{margin:0 0 12px;max-width:68ch}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:13px;color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--red);opacity:.75;border-radius:2px}
.small{font-size:13px;color:var(--mute)}
a{color:inherit}
/* minimal Leaflet core */
.leaflet-pane,.leaflet-marker-icon,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;font:13px/1.4 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;outline:0}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-pane{z-index:400}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}.leaflet-map-pane canvas{z-index:100}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer;pointer-events:auto}
.leaflet-pane>svg path{pointer-events:none}.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right;margin-right:10px}.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-bar{box-shadow:0 1px 4px rgba(0,0,0,.3);border-radius:6px;overflow:hidden}
.leaflet-bar a{display:block;width:44px;height:44px;line-height:44px;text-align:center;background:var(--bg);color:var(--ink);text-decoration:none;font:600 22px/44px Inter,sans-serif;border-bottom:1px solid var(--line)}
.leaflet-bar a:last-child{border-bottom:0}
.leaflet-bar a.leaflet-disabled{opacity:.4;cursor:default}
.leaflet-control-scale-line{border:2px solid var(--ink);border-top:0;padding:0 5px;font-size:12px;background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--ink);white-space:nowrap}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px}
.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:8px;background:var(--bg);color:var(--ink);box-shadow:0 3px 14px rgba(0,0,0,.3)}
.leaflet-popup-content{margin:12px 16px;line-height:1.4;font-size:14px;min-width:200px}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:var(--bg)}
.leaflet-popup-close-button{position:absolute;top:2px;right:4px;width:28px;height:28px;font:20px/28px Inter,sans-serif;color:var(--mute);text-decoration:none;text-align:center}
.lbl{white-space:nowrap;font:600 11px/1 Inter,sans-serif;color:var(--mute);text-shadow:0 0 3px var(--map),0 0 3px var(--map),0 0 3px var(--map);pointer-events:none}
.lbl span{display:inline-block;transform:translate(-50%,-50%) rotate(var(--a))}
.lbls-off .lbl{display:none}
.st0{stroke:var(--r0)}.st1{stroke:var(--r1)}.st2{stroke:var(--r2)}.st3{stroke:var(--r3)}.bnd{stroke:var(--bnd)}
.buf{stroke:var(--red);fill:var(--redfill)}
.dot{stroke:#fff;fill:var(--red)}
.hh{stroke:#e85d04;fill:#f48c06}.hl{stroke:#7b2cbf;fill:#9d4edd}
.toggles{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:4px}
.toggles label{display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px;cursor:pointer}
.toggles input{width:20px;height:20px;accent-color:var(--ink)}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%}
.sw.c{background:rgba(230,57,70,.25);border:1.5px solid var(--red)}
.sw.h{background:rgba(244,140,6,.3);border:1.5px solid #e85d04}
.sw.m{background:rgba(244,140,6,.15);border:1.5px dashed #e85d04}
.sw.l{background:rgba(157,78,221,.15);border:1.5px dashed #7b2cbf}
.cov td.n b{font-weight:600}
@media(max-width:600px){.figs{grid-template-columns:minmax(0,1fr)}.cols{grid-template-columns:minmax(0,1fr)}#map{height:70vh}}
</style>
</head>
<body>
<section class="band"><div class="wrap">
<h1 id="title">600-ft preschool buffers across Berkeley's licensed childcare centers</h1>
<div class="figs">
<div class="fg"><b id="f1">51</b><span>center sites mapped (64 licenses)</span></div>
<div class="fg"><b id="f2" class="red">–</b><span id="f2l">of main arterial length is inside a buffer</span></div>
</div>
</div></section>

<div id="map" role="region" aria-label="Map of Berkeley childcare buffers"></div>

<section class="band" style="padding-top:14px"><div class="wrap">
<div class="toggles" role="group" aria-label="Map layers">
<label><input type="checkbox" id="tC" checked><span class="sw c"></span>Licensed centers (state data, 51)</label>
<label><input type="checkbox" id="tH" checked><span class="sw h"></span>Google Maps: matches a state-licensed home (<span id="nH"></span>)</label>
<label><input type="checkbox" id="tL" checked><span class="sw l"></span>Google Maps: no confirmed license match (<span id="nL"></span>)</label>
</div>
<div class="legend"><span><i class="lr"></i>Arterial and collector streets</span><span><i class="lb"></i>City limit</span></div>
</div></section>

<section class="band" style="padding-top:8px"><div class="wrap" style="max-width:560px;margin:0">
<p class="small" style="margin-top:20px">Sources: <a href="https://data.chhs.ca.gov/dataset/community-care-licensing-facilities">CA Community Care Licensing</a> · Google Maps listings · <a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors</a></p>
</div></section>

function decode(txt){const out={};txt.trim().split('\n').forEach(line=>{const c=line.indexOf(':');const k=line.slice(0,c);const body=line.slice(c+1);let pl=0,pn=0;(out[k]=out[k]||[]);
